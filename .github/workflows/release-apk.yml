name: Build & release Android APK

# Runs whenever a GitHub Release is published (the APK gets attached to that
# release automatically), or manually via workflow_dispatch for an on-demand
# build you can download from the run's Artifacts tab without cutting a release.
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned cmdline-tools version — bump this URL if Google retires it.
      # See CLAUDE.md for how this mirrors the local dev toolchain setup.
      - name: Install Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools_tmp"
          mv "$ANDROID_HOME/cmdline-tools_tmp/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm -rf "$ANDROID_HOME/cmdline-tools_tmp" /tmp/cmdline-tools.zip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Prebuild native android project
        run: npx expo prebuild -p android

      - name: Build release APK
        working-directory: android
        env:
          OPENADMIN_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          OPENADMIN_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENADMIN_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENADMIN_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk OpenAdmin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAdmin.apk
          path: OpenAdmin.apk

      - name: Attach APK to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" OpenAdmin.apk --clobber --repo "${{ github.repository }}"
